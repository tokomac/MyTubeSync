<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - MyTubeSync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .language-switcher {
            text-align: right;
            margin-bottom: 20px;
        }
        .language-switcher a {
            color: #007AFF;
            text-decoration: none;
        }
        .language-switcher a:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }
        .description {
            text-align: center;
            color: #86868b;
            margin-bottom: 32px;
        }
        .contact-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        .contact-card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .contact-card a {
            display: block;
            color: #007AFF;
            text-decoration: none;
            font-size: 16px;
            padding: 12px 16px;
            background: #f5f5f7;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .contact-card a:hover {
            background: #e8e8ed;
        }
        .note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            font-size: 14px;
            color: #856404;
        }
        .back-link {
            display: inline-block;
            margin-top: 32px;
            color: #007AFF;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        var userLang = navigator.language || navigator.userLanguage;
        if (!userLang.startsWith('ja')) {
            window.location.href = 'contact-en.html';
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="language-switcher">
            日本語 | <a href="contact-en.html">English</a>
        </div>

        <h1>お問い合わせ</h1>
        <p class="description">ご質問やご意見がありましたら、以下の方法でお問い合わせください。</p>

        <div class="contact-card">
            <h2>メールでのお問い合わせ</h2>
            <a href="mailto:tokomatokomac@gmail.com">tokomatokomac@gmail.com</a>
        </div>

        <div class="note">
            <strong>ご注意:</strong> メールアプリが開かない場合は、上記のメールアドレスに直接ご連絡ください。通常、2〜3営業日以内に返信いたします。
        </div>

        <a href="index.html" class="back-link">← トップページに戻る</a>
    </div>
</body>
</html>
